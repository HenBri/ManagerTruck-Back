spring.application.name=Truck_Sass

server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/truck_sass}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}


# El esquema y las cuentas demo se gestionan con los scripts PostgreSQL.
# "create" borraba las cuentas cada vez que se reiniciaba el backend.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}


